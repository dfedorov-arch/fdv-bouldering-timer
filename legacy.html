<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таймер болдеринга (упрощённый вид)</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="app-icon.svg">
  <style>
    html,
    body {
      color-scheme: dark;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0e1116;
      color: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    body.break-active {
      background: #f05a59;
      color: #f4f7fb;
    }

    body.warning-active {
      background: #0e1116;
      color: #f4f7fb;
    }

    #wrap {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: table;
      text-align: center;
      white-space: nowrap;
    }

    #timerPane {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background: #0e1116;
    }

    #protocolPane {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: auto;
      width: 58%;
      overflow: hidden;
      background: #161b22;
      color: #f4f7fb;
      text-align: left;
    }

    body.protocol-visible #timerPane {
      right: 58%;
    }

    body.protocol-visible #protocolPane {
      display: block;
    }

    #protocolLayout {
      width: 100%;
      height: 100%;
      overflow: hidden;
      white-space: nowrap;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0;
    }

    .protocol-column {
      display: inline-block;
      width: 50%;
      height: 100%;
      overflow: hidden;
      vertical-align: top;
      white-space: normal;
      font-size: 13px;
    }

    .protocol-column.protocol-column-only {
      width: 100%;
    }

    .protocol-slot {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-left: 1px solid #39414c;
      border-bottom: 1px solid #39414c;
      box-sizing: border-box;
    }

    .protocol-title {
      height: 30px;
      padding: 6px 8px;
      overflow: hidden;
      box-sizing: border-box;
      color: #f4f7fb;
      background: #202630;
      font-size: 13px;
      font-weight: bold;
      line-height: 18px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .protocol-title.protocol-title-empty {
      display: none;
    }

    .protocol-scroll {
      position: absolute;
      left: 0;
      right: 0;
      top: 30px;
      bottom: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-color: #687384 #202630;
      -webkit-overflow-scrolling: touch;
    }

    .protocol-scroll::-webkit-scrollbar,
    #protocolPane::-webkit-scrollbar {
      width: 14px;
      height: 14px;
      background: #202630;
    }

    .protocol-scroll::-webkit-scrollbar-track,
    #protocolPane::-webkit-scrollbar-track {
      background: #202630;
    }

    .protocol-scroll::-webkit-scrollbar-thumb,
    #protocolPane::-webkit-scrollbar-thumb {
      min-height: 36px;
      border: 3px solid #202630;
      border-radius: 8px;
      background: #687384;
    }

    .protocol-scroll::-webkit-scrollbar-thumb:hover,
    #protocolPane::-webkit-scrollbar-thumb:hover {
      background: #818b99;
    }

    .protocol-slot.protocol-without-title .protocol-scroll {
      top: 0;
    }

    .protocol-table {
      width: auto;
      table-layout: auto;
      border-collapse: separate;
      border-spacing: 0;
      color: #f4f7fb;
      background: #161b22;
      font-size: 12px;
      line-height: 16px;
      white-space: nowrap;
    }

    .protocol-table th,
    .protocol-table td {
      height: 30px;
      padding: 4px 5px;
      border-right: 1px solid #39414c;
      border-bottom: 1px solid #39414c;
      box-sizing: border-box;
      white-space: nowrap;
    }

    .protocol-table .protocol-data-cell {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .protocol-table .protocol-data-cell-first {
      width: 42px;
    }

    .protocol-table .protocol-data-cell-second {
      width: 54px;
    }

    .protocol-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #242a33;
      text-align: left;
    }

    .protocol-table .protocol-route-cell {
      width: 30px;
      min-width: 30px;
      max-width: 30px;
      height: 30px;
      padding: 2px;
      text-align: center;
    }

    body.protocol-compact .protocol-title {
      height: 27px;
      padding: 5px 6px;
      font-size: 12px;
      line-height: 17px;
    }

    body.protocol-compact .protocol-scroll { top: 27px; }
    body.protocol-compact .protocol-slot.protocol-without-title .protocol-scroll { top: 0; }

    body.protocol-compact .protocol-table {
      font-size: 11px;
      line-height: 15px;
    }

    body.protocol-compact .protocol-table th,
    body.protocol-compact .protocol-table td {
      height: 27px;
      padding: 3px 4px;
    }

    body.protocol-compact .protocol-table .protocol-data-cell-first { width: 38px; }
    body.protocol-compact .protocol-table .protocol-data-cell-second { width: 48px; }

    body.protocol-compact .protocol-table .protocol-route-cell {
      width: 27px;
      min-width: 27px;
      max-width: 27px;
      height: 27px;
      padding: 2px;
    }

    body.protocol-dense .protocol-title {
      height: 25px;
      padding: 4px 5px;
      font-size: 11px;
      line-height: 17px;
    }

    body.protocol-dense .protocol-scroll { top: 25px; }
    body.protocol-dense .protocol-slot.protocol-without-title .protocol-scroll { top: 0; }

    body.protocol-dense .protocol-table {
      font-size: 10px;
      line-height: 14px;
    }

    body.protocol-dense .protocol-table th,
    body.protocol-dense .protocol-table td {
      height: 24px;
      padding: 2px 3px;
    }

    body.protocol-dense .protocol-table .protocol-data-cell-first { width: 34px; }
    body.protocol-dense .protocol-table .protocol-data-cell-second { width: 44px; }

    body.protocol-dense .protocol-table .protocol-route-cell {
      width: 24px;
      min-width: 24px;
      max-width: 24px;
      height: 24px;
      padding: 1px;
    }

    body.protocol-ultra-dense .protocol-title { height: 20px; padding: 3px 4px; font-size: 9px; line-height: 14px; }
    body.protocol-ultra-dense .protocol-scroll { top: 20px; }
    body.protocol-ultra-dense .protocol-slot.protocol-without-title .protocol-scroll { top: 0; }
    body.protocol-ultra-dense .protocol-table { font-size: 9px; line-height: 12px; }
    body.protocol-ultra-dense .protocol-table th,
    body.protocol-ultra-dense .protocol-table td { height: 18px; padding: 1px 2px; }
    body.protocol-ultra-dense .protocol-table .protocol-data-cell-first { width: 29px; }
    body.protocol-ultra-dense .protocol-table .protocol-data-cell-second { width: 38px; }
    body.protocol-ultra-dense .protocol-table .protocol-route-cell { width: 18px; min-width: 18px; max-width: 18px; height: 18px; padding: 1px; }
    body.protocol-ultra-dense .route-marker { width: 11px; height: 11px; }
    body.protocol-ultra-dense .route-marker.ready { width: 0; height: 0; border-left-width: 6px; border-right-width: 6px; border-bottom-width: 11px; }
    body.protocol-ultra-dense .route-marker.done { width: 9px; height: 9px; }
    body.protocol-ultra-dense .route-marker.paused:before,
    body.protocol-ultra-dense .route-marker.paused:after { top: 0; bottom: 0; width: 3px; }
    body.protocol-ultra-dense .route-marker.stopped:before,
    body.protocol-ultra-dense .route-marker.stopped:after { left: 4px; width: 2px; height: 11px; }

    .protocol-table tr.protocol-active td {
      background: #204a36;
    }

    .protocol-table tr.protocol-ready td {
      background: #4d4220;
    }

    .protocol-table tr.protocol-excluded td {
      position: relative;
    }

    .protocol-table tr.protocol-excluded td:after {
      content: "";
      position: absolute;
      z-index: 4;
      top: 50%;
      left: 0;
      right: -1px;
      height: 1px;
      margin-top: -1px;
      pointer-events: none;
      background: #ff4b50;
      box-shadow: 0 0 2px rgba(255, 75, 80, .72);
    }

    .protocol-table th.route-paused {
      background: #7a6328;
    }

    .protocol-table th.route-stopped {
      background: #7a3030;
    }

    .protocol-table th.route-paused-history {
      box-shadow: inset 0 0 0 2px #d5ac43;
    }

    .protocol-table th.route-stopped-history {
      box-shadow: inset 0 0 0 2px #cf5555;
    }

    .route-marker {
      display: none;
      position: relative;
      width: 15px;
      height: 15px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .route-marker.ready,
    .route-marker.active,
    .route-marker.done,
    .route-marker.paused,
    .route-marker.stopped {
      display: block;
    }

    .route-marker.ready {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 14px solid #ffc857;
    }

    .route-marker.active {
      border-radius: 50%;
      background: #4fd18b;
    }

    .route-marker.done {
      width: 12px;
      height: 12px;
      margin-top: 1px;
      background: #f05a59;
      -webkit-transform: rotate(45deg);
      transform: rotate(45deg);
    }

    .route-marker.paused:before,
    .route-marker.paused:after {
      content: "";
      position: absolute;
      top: 1px;
      bottom: 1px;
      width: 4px;
      background: #a8afb8;
    }

    .route-marker.paused:before { left: 2px; }
    .route-marker.paused:after { right: 2px; }

    .route-marker.stopped:before,
    .route-marker.stopped:after {
      content: "";
      position: absolute;
      left: 6px;
      top: 0;
      width: 3px;
      height: 16px;
      background: #f05a59;
      -webkit-transform: rotate(45deg);
      transform: rotate(45deg);
    }

    .route-marker.stopped:after {
      -webkit-transform: rotate(-45deg);
      transform: rotate(-45deg);
    }

    body.protocol-portrait #timerPane {
      right: 0;
      bottom: auto;
    }

    body.protocol-portrait #protocolPane {
      left: 0;
      width: auto;
      top: 180px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body.protocol-portrait #protocolLayout {
      height: auto;
      overflow: visible;
    }

    body.protocol-portrait .protocol-column {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    body.protocol-portrait .protocol-table {
      width: 100%;
      table-layout: fixed;
    }

    #time {
      display: table-cell;
      width: 100%;
      height: 100%;
      vertical-align: middle;
      font-size: 26vw;
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

  </style>
</head>
<body>
  <div id="timerPane">
    <div id="wrap">
      <div id="time">--:--</div>
    </div>
  </div>
  <div id="protocolPane"><div id="protocolLayout"></div></div>

  <script src="lib/start-list-display.js?v=354"></script>
  <script>
    (function () {
      var legacyBuildNumber = 354;
      var state = null;
      var serverOffset = 0;
      var lastContact = 0;

      var lastFitKey = "";
      var legacyFullscreenUnavailable = false;
      var legacyFullscreenAttemptPending = false;
      var clockSamples = [];
      var maxClockSamples = 10;
      var timerColors = {

        warningText: "#f4f7fb",
        breakText: "#f4f7fb",
        rotationBg: "#0e1116",
        warningBg: "#0e1116",
        breakBg: "#f05a59"

      var manualLegacyUrl = /(?:^|[?&])manualLegacy=1(?:&|$)/.test(window.location.search || "");
      var legacySnapshotKey = "fdvBoulderingTimerLegacySnapshot";
      var legacyProtocolSnapshotKey = "fdvBoulderingTimerLegacyProtocols";
      var legacySnapshotMaxAgeMs = 12 * 60 * 60 * 1000;
      var protocolRevision = "";
      var legacyProtocols = [];
      var protocolViews = {};
      var protocolStructureKey = "";
      var protocolProgressKey = "";
      var protocolLayoutKey = "";
      var protocolDataDirty = true;
      var protocolScrollbarWidth = null;
      var protocolSizeKey = "";
      var lastProtocolVerticalDensity = 0;
      var protocolAppliedDensity = 0;
      var lastLegacySnapshotSavedAt = 0;
      var lastLegacySnapshotVersion = null;
      var legacySnapshotSaveIntervalMs = 5000;
      var storedClientId = "";
      var storedFitText = "";
      try {
        storedClientId = sessionStorage.getItem("boulderingTimerClientId") || "";
        storedFitText = sessionStorage.getItem("boulderingTimerLegacyFitText") || "";
      } catch (error) {}
      var clientId = queryValue("clientId") || storedClientId || ("legacy-" + String(new Date().getTime()) + "-" + String(Math.random()).slice(2));
      var isOldBrowser = !window.Promise || !window.fetch || !window.requestAnimationFrame || !window.performance;
      try {
        sessionStorage.setItem("boulderingTimerClientId", clientId);
      } catch (error) {}
      if (window.history && window.history.replaceState && window.location.search) {
        try {
          window.history.replaceState(null, document.title, window.location.pathname + window.location.hash);
        } catch (error) {}
      }
      var wrapEl = document.getElementById("wrap");
      var timeEl = document.getElementById("time");
      var timerPaneEl = document.getElementById("timerPane");
      var protocolPaneEl = document.getElementById("protocolPane");
      var protocolLayoutEl = document.getElementById("protocolLayout");

      function viewportWidth() {
        if (window.visualViewport && window.visualViewport.width) return Math.floor(window.visualViewport.width);
        return window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || 360;
      }

      function viewportHeight() {
        if (window.visualViewport && window.visualViewport.height) return Math.floor(window.visualViewport.height);
        return window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight || 640;
      }

      function nativeProtocolScrollbarWidth() {
        var probe;
        var width;
        if (protocolScrollbarWidth !== null) return protocolScrollbarWidth;
        probe = document.createElement("div");
        probe.style.cssText = "position:absolute;left:-9999px;top:-9999px;width:100px;height:100px;overflow:scroll;";
        document.body.appendChild(probe);
        width = Math.max(0, probe.offsetWidth - probe.clientWidth);
        document.body.removeChild(probe);
        protocolScrollbarWidth = width || 14;
        return protocolScrollbarWidth;
      }

      function setProtocolDensity(level) {
        setBodyFlag("protocol-compact", level >= 1);
        setBodyFlag("protocol-dense", level >= 2);
        setBodyFlag("protocol-ultra-dense", level >= 3);
      }

      function protocolHighlightedIndexes(view) {
        var result = [];
        var i;
        for (i = 0; i < view.rows.length; i += 1) {
          if (view.rows[i].status === "active" || view.rows[i].status === "ready") result.push(i);
        }
        return result;
      }

      function protocolRowCapacity(view, density) {
        var rowHeights = [30, 27, 24, 18];
        var titleHeights = [30, 27, 25, 20];
        var rowHeight = rowHeights[density] || rowHeights[0];
        var titleHeight = view.list && view.list.title ? titleHeights[density] || titleHeights[0] : 0;
        var scrollHeight = Math.max(0, (view.slot.clientHeight || 0) - titleHeight);
        if (!scrollHeight) return 0;
        return Math.max(1, Math.floor((scrollHeight - rowHeight) / rowHeight) - 1);
      }

      function minimumProtocolVerticalDensity() {
        var required = 0;
        var key;
        var view;
        var highlighted;
        var span;
        for (key in protocolViews) {
          if (!Object.prototype.hasOwnProperty.call(protocolViews, key)) continue;
          view = protocolViews[key];
          highlighted = protocolHighlightedIndexes(view);
          if (!highlighted.length) continue;
          span = highlighted[highlighted.length - 1] - highlighted[0] + 1;
          if (span >= protocolRowCapacity(view, 0)) required = Math.max(required, 1);
          if (span >= protocolRowCapacity(view, 1)) required = Math.max(required, 2);
          if (span >= protocolRowCapacity(view, 2)) required = Math.max(required, 3);
        }
        return required;
      }

      function measureProtocolColumns(columns, scrollbar) {
        var widths = [];
        var total = 0;
        var tables;
        var titles;
        var width;
        var i;
        var j;
        for (i = 0; i < columns.length; i += 1) columns[i].style.width = "1px";
        for (i = 0; i < columns.length; i += 1) {
          tables = columns[i].getElementsByTagName("table");
          titles = columns[i].getElementsByClassName

            : [];
          width = 0;
          for (j = 0; j < tables.length; j += 1) width = Math.max(width, tables[j].offsetWidth, tables[j].scrollWidth);
          for (j = 0; j < titles.length; j += 1) width = Math.max(width, titles[j].scrollWidth);
          widths.push(Math.ceil(width + scrollbar + 1));
          total += widths[i];
        }
        return { widths: widths, total: total };
      }

      function sizeProtocolPane(portrait, fullWidth) {
        var columns;
        var scrollbar;
        var measurement;
        var widths;
        var total;
        var maximum;
        var scale;
        var density = minimumProtocolVerticalDensity();
        var previousDensity = protocolAppliedDensity;
        var sizeKey = (protocolIsVisible() ? "visible" : "hidden") + ":"
          + String(Boolean(portrait)) + ":" + String(fullWidth) + ":"
          + protocolStructureKey + ":" + protocolLayoutKey + ":" + String(density);
        var i;
        if (sizeKey === protocolSizeKey) return;
        protocolSizeKey = sizeKey;
        if (!protocolIsVisible()) {
          setProtocolDensity(0);
          protocolAppliedDensity = 0;
          lastProtocolVerticalDensity = 0;
          timerPaneEl.style.right = "";
          protocolPaneEl.style.width = "";
          protocolLayoutEl.style.width = "";
          return;
        }
        if (portrait) {
          setProtocolDensity(0);
          protocolAppliedDensity = 0;
          lastProtocolVerticalDensity = 0;
          timerPaneEl.style.right = "0";
          protocolPaneEl.style.width = "";
          protocolLayoutEl.style.width = "";
          if (previousDensity !== protocolAppliedDensity) window.setTimeout(reanchorProtocolViews, 0);
          return;
        }
        columns = protocolLayoutEl.getElementsByClassName
          ? protocolLayoutEl.getElementsByClassName("protocol-column")
          : [];
        if (!columns.length) return;
        scrollbar = nativeProtocolScrollbarWidth();
        maximum = Math.max(1, fullWidth - Math.min(160, Math.floor(fullWidth * 0.16)));
        lastProtocolVerticalDensity = density;
        setProtocolDensity(density);
        measurement = measureProtocolColumns(columns, scrollbar);
        if (density < 1 && measurement.total > maximum) {
          density = 1;
          setProtocolDensity(density);
          measurement = measureProtocolColumns(columns, scrollbar);
        }
        if (density < 2 && measurement.total > maximum) {
          density = 2;
          setProtocolDensity(density);
          measurement = measureProtocolColumns(columns, scrollbar);
        }
        if (density < 3 && measurement.total > maximum) {
          density = 3;
          setProtocolDensity(density);
          measurement = measureProtocolColumns(columns, scrollbar);
        }
        widths = measurement.widths;
        total = measurement.total;
        if (total > maximum) {
          scale = maximum / total;
          total = 0;
          for (i = 0; i < widths.length; i += 1) {
            widths[i] = Math.max(1, Math.floor(widths[i] * scale));
            total += widths[i];
          }
        }
        for (i = 0; i < columns.length; i += 1) columns[i].style.width = widths[i] + "px";
        protocolPaneEl.style.width = total + "px";
        protocolLayoutEl.style.width = total + "px";
        timerPaneEl.style.right = total + "px";
        protocolAppliedDensity = density;
        if (previousDensity !== protocolAppliedDensity) {
          reanchorProtocolViews();
          window.setTimeout(reanchorProtocolViews, 0);
          window.setTimeout(reanchorProtocolViews, 100);
        }
      }

      function syncViewportSize() {
        var fullWidth = viewportWidth();
        var fullHeight = viewportHeight();
        var portrait = protocolIsVisible() && (fullWidth <= 560 || fullHeight > fullWidth * 1.15);
        var timerHeight;
        if (portrait) {
          timerHeight = Math.max(150, Math.min(190, Math.floor(fullHeight * 0.26)));
          timerPaneEl.style.height = timerHeight + "px";
          protocolPaneEl.style.top = timerHeight + "px";

        if (h < 1) h = 640;

        wrapEl.style.height = h + "px";
        timeEl.style.width = w + "px";
        timeEl.style.height = h + "px";

      }

      function wideTimerText(value) {
        var text = String(value || "88:88");
        var colon = text.indexOf(":");
        var minuteDigits = colon > 0 ? colon : 2;
        var wide = "";
        var i;

        if (text === "--:--") minuteDigits = 2;
        if (minuteDigits < 2) minuteDigits = 2;
        for (i = 0; i < minuteDigits; i += 1) {

        return wide + ":88";
      }

      function fitSampleText(value) {
        var text = String(value || "");

          return;
        }
        for (i = 0; i < 13; i += 1) {

        if (!remoteNow) return;
        latency = Math.max(0, responseReceivedAt - requestStartedAt);

        var settings = activeSettings();

        var cycle = rotation + rest;
        var pos;

        if (!state) return { phase: "waiting", seconds: 0, isBreak: false, warning: false };
        if (isManualStartHoldPending()) {
          return { phase: "rotation", seconds: rotation, isBreak: false, warning: false };

        if (state.countdownOnly || (state.running && Number(state.startedAt || 0) > serverNow())) {
          return {
            phase: "start",

        if (!state.running && elapsed <= 0) return { phase: "ready", seconds: rotation, isBreak: false, warning: false };

          }

        for (i = 0; i < columns.length; i += 1) {
          if (!columns[i].length) continue;
          column = document.createElement("div");
          column.className = columns.length === 1 ? "protocol-column protocol-column-only" : "protocol-column";
          for (j = 0; j < columns[i].length; j += 1) {
            slot = document.createElement("div");
            slot.style.height = String(100 / columns[i].length) + "%";
            view = buildProtocolTable(columns[i][j], slot);
            protocolViews[String(view.index)] = view;
            column.appendChild(slot);
          }
          protocolLayoutEl.appendChild(column);
        }
        protocolProgressKey = "";
        scheduleViewportFit();
      }

      function ensureProtocolStructure() {
        var structureKey = protocolDataDirty ? JSON.stringify(protocolStructuralValue()) : protocolStructureKey;
        var layoutKey = legacyProtocols.map(function (entry) { return entry.index; }).join(",")
          + ":" + String(Boolean(state && state.startListParallel))
          + ":" + String(state && (state.language || (state.config && state.config.language)) || "ru");
        var i;
        var view;
        if (structureKey !== protocolStructureKey || layoutKey !== protocolLayoutKey) {
          protocolStructureKey = structureKey;
          protocolLayoutKey = layoutKey;
          protocolDataDirty = false;
          rebuildProtocolStructure();
          return;
        }
        for (i = 0; i < legacyProtocols.length; i += 1) {
          view = protocolViews[String(legacyProtocols[i].index)];
          if (view) view.list = legacyProtocols[i].list;
        }
        protocolDataDirty = false;
      }

      function updateProtocolMarker(cell, status) {
        if (cell.status === status) return false;
        cell.status = status;
        cell.element.className = status ? "route-marker " + status : "route-marker";
        cell.element.title = protocolMarkerLabel(status);
        return true;
      }

      function updateProtocolRow(view, participantIndex) {
        var row = view.rows[participantIndex];
        var next = "";
        var i;
        if (!row) return;
        if (row.excluded) {
          row.status = "";
          row.element.className = "protocol-excluded";
          return;
        }
        for (i = 0; i < row.cells.length; i += 1) {
          if (row.cells[i].status === "active") {
            next = "active";
            break;
          }
          if (row.cells[i].status === "ready") next = "ready";
        }
        if (row.status === next) return;
        row.status = next;
        row.element.className = next ? "protocol-" + next : "";
      }

      function updateProtocolHeaders(view, cycle) {
        var incidents = window.FDVStartListDisplay.rebaseIncidents(
          view.list.incidents,
          view.list.excludedParticipants,
          view.list.rows.length
        );
        var i;
        var status;
        var header;
        for (i = 0; i < view.routeHeaders.length; i += 1) {
          status = window.FDVStartListDisplay.routeState(i, cycle, incidents);
          header = view.routeHeaders[i];
          if (header.status === status) continue;
          header.status = status;
          header.element.className = "protocol-route-cell" + (status ? " route-" + status : "");
        }
      }

      function evaluateProtocolCells(view, position, schedule, candidates) {
        var incidents = window.FDVStartListDisplay.rebaseIncidents(
          view.list.incidents,
          view.list.excludedParticipants,
          view.list.rows.length
        );
        var dirtyRows = {};
        var participantIndex;
        var routeIndex;
        var cell;
        var status;
        var i;
        if (candidates) {
          for (i = 0; i < candidates.length; i += 1) {
            cell = candidates[i];
            status = cell.calculationParticipantIndex < 0 ? "" : window.FDVStartListDisplay.marker(
              cell.calculationParticipantIndex,
              cell.routeIndex,
              position.cycle,
              position.phase,
              incidents,
              schedule
            );
            if (updateProtocolMarker(cell, status)) dirtyRows[String(cell.participantIndex)] = true;
          }
        } else {
          for (participantIndex = 0; participantIndex < view.rows.length; participantIndex += 1) {
            for (routeIndex = 0; routeIndex < view.rows[participantIndex].cells.length; routeIndex += 1) {
              cell = view.rows[participantIndex].cells[routeIndex];
              status = cell.calculationParticipantIndex < 0 ? "" : window.FDVStartListDisplay.marker(
                cell.calculationParticipantIndex,
                routeIndex,
                position.cycle,
                position.phase,
                incidents,
                schedule
              );
              if (updateProtocolMarker(cell, status)) dirtyRows[String(participantIndex)] = true;
            }
          }
        }
        for (participantIndex in dirtyRows) {
          if (Object.prototype.hasOwnProperty.call(dirtyRows, participantIndex)) {
            updateProtocolRow(view, Number(participantIndex));
          }
        }
      }

      function uniqueProtocolCells(source) {
        var result = [];
        var seen = {};
        var i;
        var cell;
        var key;
        source = source || [];
        for (i = 0; i < source.length; i += 1) {
          cell = source[i];
          key = String(cell.participantIndex) + ":" + String(cell.routeIndex);
          if (seen[key]) continue;
          seen[key] = true;
          result.push(cell);
        }
        return result;
      }

      function fastProtocolCandidates(view, position, scheduleKey) {
        var index = view.transitionIndex;
        var source;
        if (!index || view.transitionScheduleKey !== scheduleKey || view.dataRevision !== protocolRevision) return null;
        if (position.cycle === view.lastCycle + 1) {
          source = index.transitions[String(position.cycle)] || [];
          return uniqueProtocolCells(source);
        }
        if (position.cycle === view.lastCycle
            && position.phase !== view.lastPhase
            && (position.phase === "break" || position.phase === "completed")) {
          source = index.active[String(position.cycle)] || [];
          return uniqueProtocolCells(source);
        }
        return null;
      }

      function cachedProtocolAnchor(view, cycle) {
        var participantIndex;
        var routeIndex;
        var completed;
        var status;
        if (cycle <= 0) return 0;
        for (participantIndex = 0; participantIndex < view.rows.length; participantIndex += 1) {
          if (view.rows[participantIndex].excluded) continue;
          completed = true;
          for (routeIndex = 0; routeIndex < view.rows[participantIndex].cells.length; routeIndex += 1) {
            status = view.rows[participantIndex].cells[routeIndex].status;
            if (status !== "done" && status !== "stopped") {
              completed = false;
              break;
            }
          }
          if (!completed) return Math.max(0, participantIndex - 1);
        }
        return Math.max(0, view.rows.length - 1);
      }

      function scrollProtocolToAnchor(view, anchor, settle) {
        var pass = 0;
        var left = view.scroll.scrollLeft;
        function apply() {
          var header = view.table.getElementsByTagName("thead")[0];
          var headerHeight = header ? header.offsetHeight : 0;
          var sampleRow = view.rows[0] && view.rows[0].element;
          var rowHeight = sampleRow ? sampleRow.offsetHeight : 1;
          var capacity = Math.max(1, Math.floor((view.scroll.clientHeight - headerHeight) / rowHeight) - 1);
          var highlighted = protocolHighlightedIndexes(view);
          var prioritizedAnchor = window.FDVStartListDisplay.prioritizedScrollAnchor(anchor, highlighted, capacity);
          if (highlighted.length
              && highlighted[highlighted.length - 1] - highlighted[0] + 1 >= capacity) {
            prioritizedAnchor = highlighted[0];
          }
          var row = view.rows[prioritizedAnchor] && view.rows[prioritizedAnchor].element;
          var scrollRect;
          var rowRect;
          var firstHighlightedRow;
          var lastHighlightedRow;
          var firstHighlightedRect;
          var lastHighlightedRect;
          var visibleTop;
          var visibleBottom;
          if (!row) return;
          scrollRect = view.scroll.getBoundingClientRect();
          rowRect = row.getBoundingClientRect();
          view.scroll.scrollTop = Math.max(0, view.scroll.scrollTop + rowRect.top - scrollRect.top - headerHeight);
          if (highlighted.length) {
            firstHighlightedRow = view.rows[highlighted[0]] && view.rows[highlighted[0]].element;
            lastHighlightedRow = view.rows[highlighted[highlighted.length - 1]] && view.rows[highlighted[highlighted.length - 1]].element;
            if (firstHighlightedRow && lastHighlightedRow) {
              scrollRect = view.scroll.getBoundingClientRect();
              firstHighlightedRect = firstHighlightedRow.getBoundingClientRect();
              lastHighlightedRect = lastHighlightedRow.getBoundingClientRect();
              visibleTop = scrollRect.top + headerHeight;
              visibleBottom = scrollRect.top + view.scroll.clientHeight;
              if (firstHighlightedRect.top < visibleTop - 1 || lastHighlightedRect.bottom > visibleBottom + 1) {
                view.scroll.scrollTop = Math.max(0, view.scroll.scrollTop + firstHighlightedRect.top - visibleTop);
              }
            }
          }
          view.scroll.scrollLeft = left;
          pass += 1;
          if (settle && pass < 5) window.setTimeout(apply, pass * 40);
        }
        window.setTimeout(apply, 0);
      }

      function reanchorProtocolViews() {
        var position;
        var key;
        var view;
        if (!state) return;
        position = currentProtocolPosition(currentDisplay());
        for (key in protocolViews) {
          if (!Object.prototype.hasOwnProperty.call(protocolViews, key)) continue;
          view = protocolViews[key];
          scrollProtocolToAnchor(view, cachedProtocolAnchor(view, position.cycle), true);
        }
      }

      function updateProtocolView(view, position) {
        var schedule = protocolSchedule(view.list);
        var scheduleKey = protocolScheduleKey(schedule);
        var candidates;
        var fullUpdate;
        var anchor;
        if (view.transitionScheduleKey !== scheduleKey || view.dataRevision !== protocolRevision) {
          buildTransitionIndex(view, schedule, scheduleKey);
        }
        candidates = fastProtocolCandidates(view, position, scheduleKey);
        fullUpdate = candidates === null;
        evaluateProtocolCells(view, position, schedule, candidates);
        updateProtocolHeaders(view, position.cycle);
        anchor = cachedProtocolAnchor(view, position.cycle);
        scrollProtocolToAnchor(view, anchor, view.lastCycle === null);
        view.lastCycle = position.cycle;
        view.lastPhase = position.phase;
        view.lastScheduleKey = scheduleKey;
        view.dataRevision = protocolRevision;
        return fullUpdate;
      }

      function updateProtocolSlotHeights() {
        var portrait = hasClass(document.body, "protocol-portrait");
        var slots = protocolLayoutEl.getElementsByClassName
          ? protocolLayoutEl.getElementsByClassName("protocol-slot")
          : [];
        var available = Math.max(220, protocolPaneEl.clientHeight || 400);
        var height = Math.max(220, Math.floor(available / Math.min(2, Math.max(1, slots.length))));
        var i;
        if (!portrait) return;
        for (i = 0; i < slots.length; i += 1) slots[i].style.height = height + "px";
      }

      function renderProtocols(view) {
        var visible = protocolIsVisible();
        var position;
        var progressKey;
        var key;
        setBodyFlag("protocol-visible", visible);
        protocolPaneEl.style.display = visible ? "block" : "none";
        if (!visible) {
          protocolProgressKey = "";
          return;
        }
        ensureProtocolStructure();
        position = currentProtocolPosition(view);
        progressKey = protocolRevision + ":" + String(position.cycle) + ":" + position.phase
          + ":" + protocolScheduleKey(protocolSchedule(legacyProtocols[0] && legacyProtocols[0].list));
        if (progressKey === protocolProgressKey) return;
        protocolProgressKey = progressKey;
        for (key in protocolViews) {
          if (Object.prototype.hasOwnProperty.call(protocolViews, key)) {
            updateProtocolView(protocolViews[key], position);
          }
        }
        if (minimumProtocolVerticalDensity() !== lastProtocolVerticalDensity) {
          protocolSizeKey = "";
          syncViewportSize();
        }
      }

      function render() {
        var view = currentDisplay();
        var online = new Date().getTime() - lastContact < 5000;
        setBodyFlag("break-active", view.isBreak);
        setBodyFlag("warning-active", view.warning);
        setBodyFlag("offline", !online);
        renderProtocols(view);
        timerPaneEl.style.backgroundColor = view.isBreak ? timerColors.breakBg : view.warning ? timerColors.warningBg : timerColors.rotationBg;
        document.body.style.backgroundColor = "#161b22";
        timeEl.style.color = view.isBreak ? timerColors.breakText : view.warning ? timerColors.warningText : timerColors.rotationText;
        var label = formatTime(view.seconds);
        if (timeEl.innerHTML !== label) {
          rememberFitText(label);
          timeEl.innerHTML = label;
          fitTimerText();
        }
        return view;
      }

      function nextRenderDelay(view) {
        var seconds;
        var fraction;

        if (state && view && (state.running || state.countdownOnly)) {
          seconds = Number(view.seconds);
          if (seconds > 0 && isFinite(seconds)) {
            fraction = seconds - Math.floor(seconds);
            return Math.max(30, Math.min(1025, (fraction > 0.001 ? fraction * 1000 : 1000) + 25));
          }
        }
        return 250;
      }

      function scheduleRender(view) {
        if (renderTimer) window.clearTimeout(renderTimer);
        renderTimer = window.setTimeout(renderLoop, nextRenderDelay(view));
      }

      function renderLoop() {
        scheduleRender(render());
      }

      function scheduleRequest(delay) {
        if (pollTimer) window.clearTimeout(pollTimer);
        pollTimer = window.setTimeout(requestState, delay);
      }

      function registerOfflineServiceWorker() {
        if (!("serviceWorker" in navigator) || window.location.protocol === "file:" || !window.isSecureContext) return;
        if (!window.addEventListener) return;
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").then(function (registration) {
            if (!registration || !registration.update) return;
            registration.update().then(function () {}, function () {});
          }, function () {});
        });
      }

      function finishRequest() {
        activeRequest = null;
        activeRequestStartedAt = 0;
      }

      function abortStaleRequest() {
        if (!activeRequest) return;
        if (new Date().getTime() - activeRequestStartedAt < 7000) return;
        try {
          activeRequest.abort();
        } catch (error) {}
        finishRequest();
      }

      function requestState() {
        var xhr = new XMLHttpRequest();
        var reportedScreen = window.screen
          ? String(window.screen.width || 0) + "x" + String(window.screen.height || 0)
          : "";
        var url = "/api/state?legacy=1" + (manualLegacyUrl ? "&manualLegacy=1" : "") + (isOldBrowser ? "&oldBrowser=1" : "") + "&clientId=" + encodeURIComponent(clientId)
          + "&protocolRevision=" + encodeURIComponent(protocolRevision)
          + "&viewport=" + encodeURIComponent(String(viewportWidth()) + "x" + String(viewportHeight()))
          + "&screen=" + encodeURIComponent(reportedScreen)
          + "&dpr=" + encodeURIComponent(String(window.devicePixelRatio || 1))
          + "&clientBuild=" + encodeURIComponent(String(legacyBuildNumber));
        abortStaleRequest();
        if (activeRequest) return;
        activeRequest = xhr;
        activeRequestStartedAt = new Date().getTime();
        xhr.open("GET", url, true);
        try {
          xhr.timeout = 5000;
        } catch (error) {}
        xhr.onreadystatechange = function () {
          var remote;
          var requestStartedAt;
          var responseReceivedAt;
          if (xhr.readyState !== 4) return;
          requestStartedAt = activeRequestStartedAt;
          responseReceivedAt = new Date().getTime();
          finishRequest();
          if (xhr.status < 200 || xhr.status >= 300) {
            scheduleRequest(1000);
            return;
          }
          try {
            remote = JSON.parse(xhr.responseText);
          } catch (error) {
            scheduleRequest(1000);
            return;
          }
          if (remote.legacyRedirect) {
            sessionStorage.setItem("boulderingTimerClientId", clientId);
            sessionStorage.setItem("boulderingTimerForceModern", "1");
            window.location.replace("/");
            return;
          }
          if (manualLegacyUrl && remote.manualLegacy !== true) {
            sessionStorage.setItem("boulderingTimerClientId", clientId);
            sessionStorage.setItem("boulderingTimerForceModern", "1");
            window.location.replace("/");
            return;
          }
          if (Object.prototype.hasOwnProperty.call(remote, "legacyProtocols")) {
            legacyProtocols = cleanLegacyProtocols(remote.legacyProtocols);
            protocolRevision = String(remote.protocolRevision || "");
            protocolDataDirty = true;
            protocolProgressKey = "";
            saveLegacyProtocolSnapshot();
          } else if (remote.protocolRevision) {
            protocolRevision = String(remote.protocolRevision);
          }
          state = compactRemoteState(remote);
          applyTitle(remote.language || (remote.config && remote.config.language));
          applyTimerFont(remote.config);
          applyTimerColors(remote.config);
          updateServerOffset(remote.now, requestStartedAt || responseReceivedAt, responseReceivedAt);
          saveLegacySnapshot(state);
          lastContact = responseReceivedAt;
          scheduleRender(render());
          scheduleRequest(1000);
        };
        xhr.onerror = function () {
          finishRequest();
          scheduleRequest(1000);
        };
        xhr.ontimeout = function () {
          finishRequest();
          scheduleRequest(1000);
        };
        xhr.onabort = function () {
          finishRequest();
          scheduleRequest(1000);
        };
        try {
          xhr.send(null);
        } catch (error) {
          finishRequest();
          scheduleRequest(1000);
        }
      }

      registerOfflineServiceWorker();
      restoreLegacyProtocolSnapshot();
      restoreLegacySnapshot();
      requestState();
      scheduleRender(render());
      window.setInterval(function () {
        abortStaleRequest();
      }, 3000);
      if (window.addEventListener) {
        window.addEventListener("online", function () { scheduleRequest(0); });
        window.addEventListener("pageshow", function () { scheduleRequest(0); scheduleViewportFit(); });
        window.addEventListener("focus", function () { scheduleRequest(0); scheduleViewportFit(); });
      }
    })();
  </script>
</body>
</html>
