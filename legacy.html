<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таймер болдеринга (упрощённый вид)</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="app-icon.svg">
  <style>
    @font-face {
      font-family: "FDV LCD";
      src: url("fonts/DSEG7Classic-Regular.woff2") format("woff2"),
           url("fonts/DSEG7Classic-Regular.woff") format("woff");
      font-style: normal;
      font-weight: normal;
    }

    @font-face {
      font-family: "FDV LCD";
      src: url("fonts/DSEG7Classic-Bold.woff2") format("woff2"),
           url("fonts/DSEG7Classic-Bold.woff") format("woff");
      font-style: normal;
      font-weight: bold;
    }

    html,
    body {
      color-scheme: dark;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0e1116;
      color: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    body.break-active {
      background: #f05a59;
      color: #f4f7fb;
    }

    body.warning-active {
      background: #0e1116;
      color: #f4f7fb;
    }

    #wrap {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: table;
      text-align: center;
      white-space: nowrap;
    }

    #timerPane {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      background: #0e1116;
    }

    #protocolPane {
      display: none;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: auto;
      width: 58%;
      overflow: hidden;
      background: #161b22;
      color: #f4f7fb;
      text-align: left;
    }

    body.protocol-visible #timerPane {
      right: 58%;
    }

    body.protocol-visible #protocolPane {
      display: block;
    }

    #protocolLayout {
      width: 100%;
      height: 100%;
      overflow: hidden;
      white-space: nowrap;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0;
    }

    .protocol-column {
      display: inline-block;
      width: 50%;
      height: 100%;
      overflow: hidden;
      vertical-align: top;
      white-space: normal;
      font-size: 13px;
    }

    .protocol-column.protocol-column-only {
      width: 100%;
    }

    .protocol-slot {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-left: 1px solid #39414c;
      border-bottom: 1px solid #39414c;
      box-sizing: border-box;
    }

    .protocol-title {
      height: 30px;
      padding: 6px 8px;
      overflow: hidden;
      box-sizing: border-box;
      color: #f4f7fb;
      background: #202630;
      font-size: 13px;
      font-weight: bold;
      line-height: 18px;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .protocol-title.protocol-title-empty {
      display: none;
    }

    .protocol-scroll {
      position: absolute;
      left: 0;
      right: 0;
      top: 30px;
      bottom: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-color: #687384 #202630;
      -webkit-overflow-scrolling: touch;
    }

    .protocol-scroll.protocol-horizontal-overflow {
      overflow-x: auto;
    }

    .protocol-scroll::-webkit-scrollbar,
    #protocolPane::-webkit-scrollbar {
      width: 14px;
      height: 14px;
      background: #202630;
    }

    .protocol-scroll::-webkit-scrollbar-track,
    #protocolPane::-webkit-scrollbar-track {
      background: #202630;
    }

    .protocol-scroll::-webkit-scrollbar-thumb,
    #protocolPane::-webkit-scrollbar-thumb {
      min-height: 36px;
      border: 3px solid #202630;
      border-radius: 8px;
      background: #687384;
    }

    .protocol-scroll::-webkit-scrollbar-thumb:hover,
    #protocolPane::-webkit-scrollbar-thumb:hover {
      background: #818b99;
    }

    .protocol-slot.protocol-without-title .protocol-scroll {
      top: 0;
    }

    .protocol-table {
      width: auto;
      table-layout: auto;
      border-collapse: separate;
      border-spacing: 0;
      color: #f4f7fb;
      background: #161b22;
      font-size: 12px;
      line-height: 16px;
      white-space: nowrap;
    }

    .protocol-table.protocol-columns-synchronized {
      width: auto;
      table-layout: fixed;
    }

    .protocol-table th,
    .protocol-table td {
      height: 30px;
      padding: 4px 5px;
      border-right: 1px solid #39414c;
      border-bottom: 1px solid #39414c;
      box-sizing: border-box;
      white-space: nowrap;
    }

    .protocol-table th.protocol-data-cell {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .protocol-table td.protocol-data-cell {
      overflow: visible;
      text-overflow: clip;
    }

    .protocol-table .protocol-data-cell-first {
      width: 42px;
    }

    .protocol-table .protocol-data-cell-second {
      width: 54px;
    }

    .protocol-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #242a33;
      text-align: left;
    }

    body.protocol-sticky-fallback .protocol-table thead {
      position: relative;
      z-index: 20;
    }

    body.protocol-sticky-fallback .protocol-table tbody {
      position: relative;
      z-index: 1;
    }

    body.protocol-sticky-fallback .protocol-table th {
      position: relative;
      top: auto;
      z-index: 21;
      background: #242a33;
    }

    .protocol-table .protocol-route-cell {
      width: 30px;
      min-width: 30px;
      max-width: 30px;
      height: 30px;
      padding: 2px;
      text-align: center;
    }

    body.protocol-compact .protocol-title {
      height: 27px;
      padding: 5px 6px;
      font-size: 12px;
      line-height: 17px;
    }

    body.protocol-compact .protocol-scroll { top: 27px; }
    body.protocol-compact .protocol-slot.protocol-without-title .protocol-scroll { top: 0; }

    body.protocol-compact .protocol-table {
      font-size: 11px;
      line-height: 15px;
    }

    body.protocol-compact .protocol-table th,
    body.protocol-compact .protocol-table td {
      height: 27px;
      padding: 3px 4px;
    }

    body.protocol-compact .protocol-table .protocol-data-cell-first { width: 38px; }
    body.protocol-compact .protocol-table .protocol-data-cell-second { width: 48px; }

    body.protocol-compact .protocol-table .protocol-route-cell {
      width: 27px;
      min-width: 27px;
      max-width: 27px;
      height: 27px;
      padding: 2px;
    }

    body.protocol-dense .protocol-title {
      height: 25px;
      padding: 4px 5px;
      font-size: 11px;
      line-height: 17px;
    }

    body.protocol-dense .protocol-scroll { top: 25px; }
    body.protocol-dense .protocol-slot.protocol-without-title .protocol-scroll { top: 0; }

    body.protocol-dense .protocol-table {
      font-size: 10px;
      line-height: 14px;
    }

    body.protocol-dense .protocol-table th,
    body.protocol-dense .protocol-table td {
      height: 24px;
      padding: 2px 3px;
    }

    body.protocol-dense .protocol-table .protocol-data-cell-first { width: 34px; }
    body.protocol-dense .protocol-table .protocol-data-cell-second { width: 44px; }

    body.protocol-dense .protocol-table .protocol-route-cell {
      width: 24px;
      min-width: 24px;
      max-width: 24px;
      height: 24px;
      padding: 1px;
    }

    body.protocol-ultra-dense .protocol-title { height: 20px; padding: 3px 4px; font-size: 9px; line-height: 14px; }
    body.protocol-ultra-dense .protocol-scroll { top: 20px; }
    body.protocol-ultra-dense .protocol-slot.protocol-without-title .protocol-scroll { top: 0; }
    body.protocol-ultra-dense .protocol-table { font-size: 9px; line-height: 12px; }
    body.protocol-ultra-dense .protocol-table th,
    body.protocol-ultra-dense .protocol-table td { height: 18px; padding: 1px 2px; }
    body.protocol-ultra-dense .protocol-table .protocol-data-cell-first { width: 29px; }
    body.protocol-ultra-dense .protocol-table .protocol-data-cell-second { width: 38px; }
    body.protocol-ultra-dense .protocol-table .protocol-route-cell { width: 18px; min-width: 18px; max-width: 18px; height: 18px; padding: 1px; }
    body.protocol-ultra-dense .route-marker { width: 11px; height: 11px; }
    body.protocol-ultra-dense .route-marker.ready { width: 0; height: 0; border-left-width: 6px; border-right-width: 6px; border-bottom-width: 11px; }
    body.protocol-ultra-dense .route-marker.done { width: 9px; height: 9px; }
    body.protocol-ultra-dense .route-marker.paused:before,
    body.protocol-ultra-dense .route-marker.paused:after { top: 0; bottom: 0; width: 3px; }
    body.protocol-ultra-dense .route-marker.stopped:before,
    body.protocol-ultra-dense .route-marker.stopped:after { left: 4px; width: 2px; height: 11px; }

    .protocol-table tr.protocol-active td {
      background: #204a36;
    }

    .protocol-table tr.protocol-ready td {
      background: #4d4220;
    }

    .protocol-table tr.protocol-excluded td {
      position: relative;
    }

    .protocol-table tr.protocol-excluded td:after {
      content: "";
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 0;
      right: -1px;
      height: 1px;
      margin-top: -1px;
      pointer-events: none;
      background: #ff4b50;
      box-shadow: 0 0 2px rgba(255, 75, 80, .72);
    }

    .protocol-table th.route-paused {
      background: #7a6328;
    }

    .protocol-table th.route-stopped {
      background: #7a3030;
    }

    .protocol-table th.route-paused-history {
      box-shadow: inset 0 0 0 2px #d5ac43;
    }

    .protocol-table th.route-stopped-history {
      box-shadow: inset 0 0 0 2px #cf5555;
    }

    .route-marker {
      display: none;
      position: relative;
      width: 15px;
      height: 15px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .route-marker.ready,
    .route-marker.active,
    .route-marker.done,
    .route-marker.paused,
    .route-marker.stopped {
      display: block;
    }

    .route-marker.ready {
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 14px solid #ffc857;
    }

    .route-marker.active {
      border-radius: 50%;
      background: #4fd18b;
    }

    .route-marker.done {
      width: 12px;
      height: 12px;
      margin-top: 1px;
      background: #f05a59;
      -webkit-transform: rotate(45deg);
      transform: rotate(45deg);
    }

    .route-marker.paused:before,
    .route-marker.paused:after {
      content: "";
      position: absolute;
      top: 1px;
      bottom: 1px;
      width: 4px;
      background: #a8afb8;
    }

    .route-marker.paused:before { left: 2px; }
    .route-marker.paused:after { right: 2px; }

    .route-marker.stopped:before,
    .route-marker.stopped:after {
      content: "";
      position: absolute;
      left: 6px;
      top: 0;
      width: 3px;
      height: 16px;
      background: #f05a59;
      -webkit-transform: rotate(45deg);
      transform: rotate(45deg);
    }

    .route-marker.stopped:after {
      -webkit-transform: rotate(-45deg);
      transform: rotate(-45deg);
    }

    body.protocol-portrait #timerPane {
      right: 0;
      bottom: auto;
    }

    body.protocol-portrait #protocolPane {
      left: 0;
      right: 0;
      width: auto !important;
      top: 180px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body.protocol-portrait #protocolLayout {
      width: 100% !important;
      height: auto;
      overflow: visible;
    }

    body.protocol-portrait .protocol-column {
      display: block;
      width: 100% !important;
      height: auto;
      overflow: visible;
    }

    body.protocol-portrait .protocol-table {
      width: 100% !important;
      table-layout: fixed;
    }

    #timerContent {
      display: table-row;
      width: 100%;
    }

    #time {
      display: table-cell;
      width: 100%;
      height: 100%;
      vertical-align: middle;
      font-size: 26vw;
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #serverClock {
      position: absolute;
      left: 50%;
      bottom: 0;
      z-index: 2;
      display: none;
      min-width: 218px;
      margin: 0;
      padding: 8px 13px 6px;
      overflow: hidden;
      border: 1px solid #394033;
      border-radius: 10px;
      box-sizing: border-box;
      color: #252b24;
      background: #969e82;
      font-family: "FDV LCD", "Courier New", monospace;
      font-size: 34px;
      font-weight: bold;
      line-height: 1;
      letter-spacing: 2px;
      white-space: nowrap;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
    }

    #serverClock:before {
      content: "88:88:88";
      position: absolute;
      left: 13px;
      top: 8px;
      color: #7f876f;
    }

    #serverClockText {
      position: relative;
      z-index: 1;
    }

    #browserNumberBadge {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 100;
      min-width: 52px;
      height: 52px;
      padding: 0 9px;
      border: 1px solid #7f8998;
      border: 1px solid rgba(168, 177, 190, .3);
      border-radius: 12px;
      box-sizing: border-box;
      color: #e4e9f0;
      color: rgba(228, 233, 240, .68);
      background: #5e6876;
      background: rgba(94, 104, 118, .42);
      font-size: 28px;
      font-weight: bold;
      line-height: 50px;
      text-align: center;
      pointer-events: none;
    }

  </style>
</head>
<body>
  <div id="timerPane">
    <div id="browserNumberBadge"></div>
    <div id="wrap">
      <div id="timerContent">
        <div id="time">--:--</div>
      </div>
      <div id="serverClock"><span id="serverClockText">00:00:00</span></div>
    </div>
  </div>
  <div id="protocolPane"><div id="protocolLayout"></div></div>

  <script src="lib/start-list-display.js?v=390"></script>
  <script>

      var manualLegacyUrl = /(?:^|[?&])manualLegacy=1(?:&|$)/.test(window.location.search || "");

      var protocolViews = {};

        value = String(value || "").replace(/[;"{}<>]/g, "").trim();
        return value || fallback;
      }

      function applyTimerFont(config) {
        var fontUrl = config && config.timerFontUrl ? String(config.timerFontUrl) : "";
        var fallback = config && config.timerFont ? String(config.timerFont) : "Arial, Helvetica, sans-serif";
        var key = fontUrl + "|" + fallback;
        var style;

        if (key === appliedFontKey) return;
        appliedFontKey = key;
        if (!fontUrl) {
          timeEl.style.fontFamily = fallback || "Arial, Helvetica, sans-serif";
          invalidateTimerFit();
          fitTimerText();
          return;
        }

        style = document.getElementById("legacyTimerFontFace");
        if (!style) {
          style = document.createElement("style");
          style.id = "legacyTimerFontFace";
          document.getElementsByTagName("head")[0].appendChild(style);
        }
        style.innerHTML = "@font-face{font-family:\"FDV Legacy Timer\";src:url(\"" + cssUrl(fontUrl) + "\");font-weight:100 900;font-style:normal;font-display:swap;}";
        timeEl.style.fontFamily = "\"FDV Legacy Timer\", " + (cssString(fallback) || "Arial, Helvetica, sans-serif");
        invalidateTimerFit();
        fitTimerText();
        if (window.FontFace) {
          try {
            var ff = new FontFace("FDV Legacy Timer", "url(" + cssUrl(fontUrl) + ")");
            ff.load().then(function () { invalidateTimerFit(); fitTimerText(); });
          } catch (e) {}
        } else {
          window.setTimeout(function () { invalidateTimerFit(); fitTimerText(); }, 500);
        }
      }

      function applyTimerColors(config) {
        config = config || {};
        timerColors = {
          countdownText: colorValue(config.countdownTextColor, timerColors.countdownText),
          rotationText: colorValue(config.rotationTextColor, timerColors.rotationText),
          warningText: colorValue(config.rotationLastFiveTextColor, timerColors.warningText),
          breakText: colorValue(config.breakTextColor, timerColors.breakText),
          countdownBg: colorValue(config.countdownBackgroundColor, timerColors.countdownBg),
          rotationBg: colorValue(config.rotationBackgroundColor, timerColors.rotationBg),
          warningBg: colorValue(config.rotationLastFiveBackgroundColor, timerColors.warningBg),
          breakBg: colorValue(config.breakBackgroundColor, timerColors.breakBg)
        };
      }

      function cleanClockSamples(samples) {
        var clean = [];
        var item;
        var i;
        if (!samples || !samples.length) return clean;
        for (i = 0; i < samples.length && clean.length < maxClockSamples; i += 1) {
          item = samples[i];
          if (!item) continue;
          if (!isFinite(Number(item.latency)) || !isFinite(Number(item.offset))) continue;
          clean.push({
            latency: Math.max(0, Number(item.latency)),
            offset: Number(item.offset)
          });
        }
        return clean;
      }

      function compactRemoteState(remote) {
        var compact = {};
        var key;
        for (key in remote) {
          if (!Object.prototype.hasOwnProperty.call(remote, key)) continue;
          if (key === "legacyProtocols" || key === "startLists") continue;
          compact[key] = remote[key];
        }
        return compact;
      }

      function saveLegacySnapshot(remote) {
        var savedAtWall;
        var remoteVersion;
        if (!remote || !window.localStorage || window.location.protocol === "file:") return;
        performanceCount("snapshotCalls");
        savedAtWall = new Date().getTime();
        remoteVersion = Number(remote.version);
        if (lastLegacySnapshotSavedAt
            && remoteVersion === lastLegacySnapshotVersion
            && savedAtWall - lastLegacySnapshotSavedAt < legacySnapshotSaveIntervalMs) return;
        try {
          localStorage.setItem(legacySnapshotKey, JSON.stringify({
            schemaVersion: 1,
            savedAtWall: savedAtWall,
            serverNow: Number(remote.now || 0),
            serverOffset: Number(serverOffset || 0),
            clockSamples: cleanClockSamples(clockSamples),
            state: compactRemoteState(remote)
          }));
          lastLegacySnapshotSavedAt = savedAtWall;
          lastLegacySnapshotVersion = remoteVersion;
          performanceCount("snapshotWrites");
        } catch (error) {}
      }

      function saveLegacyProtocolSnapshot() {
        if (!window.localStorage || window.location.protocol === "file:") return;
        try {
          localStorage.setItem(legacyProtocolSnapshotKey, JSON.stringify({
            schemaVersion: 1,
            savedAtWall: new Date().getTime(),
            protocolRevision: protocolRevision,
            protocols: legacyProtocols
          }));
          performanceCount("protocolSnapshotWrites");
        } catch (error) {}
      }

      function restoreLegacyProtocolSnapshot() {
        var snapshot;
        var age;
        if (!window.localStorage || window.location.protocol === "file:") return false;
        try {
          snapshot = JSON.parse(localStorage.getItem(legacyProtocolSnapshotKey) || "null");
        } catch (error) {
          return false;
        }
        if (!snapshot || snapshot.schemaVersion !== 1 || !snapshot.protocolRevision || !snapshot.protocols) return false;
        age = new Date().getTime() - Number(snapshot.savedAtWall || 0);
        if (!isFinite(age) || age < 0 || age > legacySnapshotMaxAgeMs) return false;
        protocolRevision = String(snapshot.protocolRevision || "");
        legacyProtocols = cleanLegacyProtocols(snapshot.protocols);
        protocolDataDirty = true;
        return true;
      }

      function restoreLegacySnapshot() {
        var snapshot;
        var savedAtWall;
        var age;
        var restoredServerNow;
        var restoredOffset;
        if (!window.localStorage || window.location.protocol === "file:") return false;
        try {
          snapshot = JSON.parse(localStorage.getItem(legacySnapshotKey) || "null");
        } catch (error) {
          return false;
        }
        if (!snapshot || snapshot.schemaVersion !== 1 || !snapshot.state) return false;
        savedAtWall = Number(snapshot.savedAtWall || 0);
        age = new Date().getTime() - savedAtWall;
        if (!isFinite(savedAtWall) || age < 0 || age > legacySnapshotMaxAgeMs) return false;
        state = snapshot.state;
        restoredOffset = Number(snapshot.serverOffset);
        clockSamples = cleanClockSamples(snapshot.clockSamples);
        if (isFinite(restoredOffset)) {
          serverOffset = restoredOffset;
        } else {
          restoredServerNow = (Number(snapshot.serverNow || 0) || savedAtWall) + age;
          serverOffset = restoredServerNow - new Date().getTime();
        }
        applyTitle(state.language || (state.config && state.config.language));
        applyTimerFont(state.config);
        applyTimerColors(state.config);
        return true;
      }

      function elapsedSeconds() {
        if (!state) return 0;
        if (!state.running) return Number(state.elapsedBeforePause || state.elapsed || 0) || 0;
        if (Number(state.startedAt || 0) > serverNow()) return 0;
        return Math.max(0, (serverNow() - Number(state.startedAt || 0)) / 1000);
      }

      function isManualStartHoldPending() {
        return state
          && state.running
          && !state.countdownOnly
          && Boolean(state.manualStartDisplayHold)
          && Number(state.startedAt || 0) > serverNow();
      }

      function currentDisplay() {
        var settings = activeSettings();
        var elapsed = elapsedSeconds();
        var rotation = settings.rotationSeconds;
        var rest = settings.breakSeconds;
        var cycle = rotation + rest;
        var pos;

        if (!state) return { phase: "waiting", seconds: 0, isBreak: false, warning: false };
        if (isManualStartHoldPending()) {
          return { phase: "rotation", seconds: rotation, isBreak: false, warning: false };
        }
        if (state.countdownOnly || (state.running && Number(state.startedAt || 0) > serverNow())) {
          return {
            phase: "start",
            seconds: Math.max(0, (Number(state.startedAt || 0) - serverNow()) / 1000),
            isBreak: false,
            warning: false
          };
        }
        if (state.waitingForManualStart) return { phase: "ready", seconds: 0, isBreak: false, warning: false };
        if (state.completed) return { phase: "done", seconds: 0, isBreak: false, warning: false };
        if (!state.running && elapsed <= 0) return { phase: "ready", seconds: rotation, isBreak: false, warning: false };

        if (settings.oneShot) {
          if (elapsed < rotation) {
            return { phase: "rotation", seconds: rotation - elapsed, isBreak: false, warning: rotation - elapsed <= 5 };
          }
          if (rest > 0 && elapsed < rotation + rest) {
            return { phase: "break", seconds: rotation + rest - elapsed, isBreak: true, warning: false };
          }
          return { phase: "done", seconds: 0, isBreak: false, warning: false };
        }

        if (cycle <= 0) return { phase: "ready", seconds: 0, isBreak: false, warning: false };
        pos = elapsed % cycle;
        if (rest > 0 && pos >= rotation) {
          return { phase: "break", seconds: cycle - pos, isBreak: true, warning: false };
        }
        return { phase: "rotation", seconds: rotation - pos, isBreak: false, warning: rotation - pos <= 5 };
      }

      function currentTimerCycle() {
        var settings;
        var elapsed;
        var cycleLength;
        if (!state || state.countdownOnly || (state.running && Number(state.startedAt || 0) > serverNow())) return 0;
        settings = activeSettings();
        elapsed = elapsedSeconds();
        if (!state.running && elapsed <= 0) return 0;
        if (settings.oneShot) {
          return elapsed < settings.rotationSeconds + settings.breakSeconds ? 1 : 0;
        }
        cycleLength = settings.rotationSeconds + settings.breakSeconds;
        return cycleLength > 0 ? Math.floor(Math.max(0, elapsed) / cycleLength) + 1 : 0;
      }

      function hasClass(element, name) {
        return (" " + String(element.className || "") + " ").indexOf(" " + name + " ") >= 0;
      }

      function setBodyFlag(name, enabled) {
        var classes = String(document.body.className || "").split(/\s+/);
        var next = [];
        var found = false;
        var nextClassName;
        var i;
        for (i = 0; i < classes.length; i += 1) {
          if (!classes[i]) continue;
          if (classes[i] === name) {
            found = true;
            if (enabled) next.push(classes[i]);
          } else {
            next.push(classes[i]);
          }
        }
        if (enabled && !found) next.push(name);
        nextClassName = next.join(" ");
        if (document.body.className !== nextClassName) document.body.className = nextClassName;
      }

      function cleanLegacyProtocols(value) {
        var source = Object.prototype.toString.call(value) === "[object Array]" ? value : [];
        var clean = [];
        var i;
        var entry;
        var list;
        for (i = 0; i < source.length && clean.length < 4; i += 1) {
          entry = source[i];
          list = entry && entry.list;
          if (!list || Object.prototype.toString.call(list.headers) !== "[object Array]"
              || Object.prototype.toString.call(list.rows) !== "[object Array]") continue;
          clean.push({ index: Math.max(0, Math.min(3, Math.round(Number(entry.index) || 0))), list: list });
        }
        clean.sort(function (left, right) { return left.index - right.index; });
        return clean;
      }

      function protocolDisplayPreset() {
        if (!state) return "";
        return state.running || Number(state.elapsedBeforePause || 0) > 0 || state.completed
          ? String(state.runtimePreset || state.activePreset || "")
          : String(state.activePreset || "");
      }

      function protocolIsVisible() {
        var preset = protocolDisplayPreset();
        return Boolean(state && state.startListEnabled && legacyProtocols.length
          && (preset === "classic" || preset === "final"));
      }

      function protocolRawSettings() {
        var started = state && (state.running || Number(state.elapsedBeforePause || 0) > 0 || state.completed);
        if (!state) return {};
        return started ? (state.activeSettings || {}) : (state.draftSettings || state.activeSettings || {});
      }

      function currentProtocolPosition(view) {
        var settings = activeSettings();
        var elapsed = elapsedSeconds();
        var preset = protocolDisplayPreset();
        var secondsUntilStart;
        var scheduledCountdown;
        var completedCycles;
        var cycleLength;
        var cycle;
        if (!state || !legacyProtocols.length) return { cycle: 0, phase: "ready" };
        secondsUntilStart = Math.max(0, (Number(state.startedAt || 0) - serverNow()) / 1000);
        scheduledCountdown = state.countdownOnly
          || (state.running && Number(state.startedAt || 0) > serverNow() && !state.manualStartDisplayHold);
        if (scheduledCountdown) {
          return {
            cycle: window.FDVStartListDisplay.scheduledCycle(secondsUntilStart, settings.rotationSeconds),
            phase: "ready",
            scheduled: true
          };
        }
        if (preset === "final") {
          completedCycles = Math.max(0, Math.round(Number(state.startListFinalCycle) || 0));
          if (!state.running && !state.completed && Number(state.elapsedBeforePause || 0) === 0) {
            return completedCycles
              ? { cycle: completedCycles, phase: "completed" }
              : { cycle: 0, phase: "ready" };
          }
          return {
            cycle: completedCycles + 1,
            phase: state.completed || view.phase === "done" ? "completed" : (view.isBreak ? "break" : "rotation")
          };
        }
        if (!state.running && Number(state.elapsedBeforePause || 0) === 0) return { cycle: 0, phase: "ready" };
        cycleLength = settings.rotationSeconds + settings.breakSeconds;
        cycle = cycleLength > 0 ? Math.floor(Math.max(0, elapsed) / cycleLength) + 1 : 0;
        return { cycle: cycle, phase: view.isBreak ? "break" : "rotation" };
      }

      function protocolSchedule(list) {
        var settings = protocolRawSettings();
        if (protocolDisplayPreset() !== "final") return {};
        return {
          finalFormat: settings.finalRoundFormat === "new" ? "new" : "old",
          restRotations: Number(settings.finalRestRotations) || 3,
          participantCount: list && list.rows
            ? window.FDVStartListDisplay.includedParticipantCount(list.rows.length, list.excludedParticipants) || 1
            : 1
        };
      }

      function protocolScheduleKey(schedule) {
        return String(schedule.finalFormat || "classic") + ":"
          + String(schedule.restRotations || 0) + ":" + String(schedule.participantCount || 0);
      }

      function protocolMarkerLabel(status) {
        var english = state && (state.language === "en" || (state.config && state.config.language === "en"));
        var labelsEn = { ready: "Preparing", active: "Climbing", done: "Completed", paused: "Paused", stopped: "Route stopped" };
        var labelsRu = { ready: "Подготовка", active: "На трассе", done: "Завершено", paused: "Пауза", stopped: "Трасса остановлена" };
        return (english ? labelsEn : labelsRu)[status] || "";
      }

      function protocolStructuralValue() {
        var result = [];
        var i;
        var entry;
        for (i = 0; i < legacyProtocols.length; i += 1) {
          entry = legacyProtocols[i];
          result.push({
            index: entry.index,
            title: entry.list.title || "",
            headers: entry.list.headers,
            rows: entry.list.rows,
            routeCount: entry.list.routeCount,
            excludedParticipants: entry.list.excludedParticipants || []
          });
        }
        return result;
      }

      function appendCellBucket(bucket, cycle, cell) {
        var key = String(cycle);
        if (!bucket[key]) bucket[key] = [];
        bucket[key].push(cell);
      }

      function buildTransitionIndex(view, schedule, scheduleKey) {
        var incidents = window.FDVStartListDisplay.rebaseIncidents(
          view.list.incidents,
          view.list.excludedParticipants,
          view.list.rows.length
        );
        var transitions = {};
        var active = {};
        var participantIndex;
        var routeIndex;
        var cell;
        var activeCycle;
        if (incidents.length) {
          view.transitionIndex = null;
          view.transitionScheduleKey = scheduleKey;
          return;
        }
        for (participantIndex = 0; participantIndex < view.rows.length; participantIndex += 1) {
          if (view.rows[participantIndex].excluded) continue;
          for (routeIndex = 0; routeIndex < view.rows[participantIndex].cells.length; routeIndex += 1) {
            cell = view.rows[participantIndex].cells[routeIndex];
            activeCycle = window.FDVStartListDisplay.attemptCycle(cell.calculationParticipantIndex, routeIndex, schedule);
            appendCellBucket(transitions, activeCycle - 1, cell);
            appendCellBucket(transitions, activeCycle, cell);
            appendCellBucket(transitions, activeCycle + 1, cell);
            appendCellBucket(active, activeCycle, cell);
          }
        }
        view.transitionIndex = { transitions: transitions, active: active };
        view.transitionScheduleKey = scheduleKey;
      }

      function buildProtocolTable(entry, slot) {
        var list = entry.list;
        var title = document.createElement("div");
        var scroll = document.createElement("div");
        var table = document.createElement("table");
        var colgroup = document.createElement("colgroup");
        var thead = document.createElement("thead");
        var headRow = document.createElement("tr");
        var tbody = document.createElement("tbody");
        var routeHeaders = [];
        var rows = [];
        var i;
        var j;
        var th;
        var tr;
        var td;
        var markerEl;
        var columnEl;
        var excludedParticipants = window.FDVStartListDisplay.normalizeExcludedParticipants(list.excludedParticipants, list.rows.length);
        var excluded;
        var calculationParticipantIndex;
        var english = state && (state.language === "en" || (state.config && state.config.language === "en"));
        title.className = list.title ? "protocol-title" : "protocol-title protocol-title-empty";
        title.appendChild(document.createTextNode(String(list.title || "")));
        slot.className = list.title ? "protocol-slot" : "protocol-slot protocol-without-title";
        scroll.className = "protocol-scroll";
        table.className = "protocol-table";
        table._fdvDataColumnCount = list.headers.length;
        table._fdvRouteColumnCount = list.routeCount;
        for (i = 0; i < list.headers.length + list.routeCount; i += 1) {
          columnEl = document.createElement("col");
          colgroup.appendChild(columnEl);
        }
        table.appendChild(colgroup);
        for (i = 0; i < list.headers.length; i += 1) {
          th = document.createElement("th");
          th.className = "protocol-data-cell" + (i === 0 ? " protocol-data-cell-first" : i === 1 ? " protocol-data-cell-second" : "");
          th.title = String(list.headers[i] || "");
          th.appendChild(document.createTextNode(String(list.headers[i] || "")));
          headRow.appendChild(th);
        }
        for (i = 0; i < list.routeCount; i += 1) {
          th = document.createElement("th");
          th.className = "protocol-route-cell";
          th.title = (english ? "Route " : "Трасса ") + String(i + 1);
          th.appendChild(document.createTextNode(list.routeCount === 1 ? (english ? "R" : "T") : String(i + 1)));
          headRow.appendChild(th);
          routeHeaders.push({ element: th, status: "" });
        }
        thead.appendChild(headRow);
        table.appendChild(thead);
        for (i = 0; i < list.rows.length; i += 1) {
          tr = document.createElement("tr");
          excluded = excludedParticipants.indexOf(i) !== -1;
          calculationParticipantIndex = window.FDVStartListDisplay.participantScheduleIndex(i, excludedParticipants, list.rows.length);
          if (excluded) tr.className = "protocol-excluded";
          for (j = 0; j < list.headers.length; j += 1) {
            td = document.createElement("td");
            td.className = "protocol-data-cell" + (j === 0 ? " protocol-data-cell-first" : j === 1 ? " protocol-data-cell-second" : "");
            td.title = String(list.rows[i][j] || "");
            td.appendChild(document.createTextNode(String(list.rows[i][j] || "")));
            tr.appendChild(td);
          }
          var routeCells = [];
          for (j = 0; j < list.routeCount; j += 1) {
            td = document.createElement("td");
            td.className = "protocol-route-cell";
            markerEl = document.createElement("span");
            markerEl.className = "route-marker";
            td.appendChild(markerEl);
            tr.appendChild(td);
            routeCells.push({ element: markerEl, status: "", participantIndex: i, calculationParticipantIndex: calculationParticipantIndex, routeIndex: j });
          }
          tbody.appendChild(tr);
          rows.push({ element: tr, cells: routeCells, status: "", excluded: excluded });
        }
        table.appendChild(tbody);
        scroll.appendChild(table);
        slot.appendChild(title);
        slot.appendChild(scroll);
        if (protocolStickyHeaderFallback) {
          scroll.onscroll = function () {
            positionProtocolFallbackHeader(scroll, table);
          };
        }
        performanceCount("protocolTablesBuilt");
        performanceCount("protocolRowsBuilt", list.rows.length);
        performanceCount("protocolRouteCellsBuilt", list.rows.length * list.routeCount);
        return {
          index: entry.index,
          list: list,
          slot: slot,
          scroll: scroll,
          table: table,
          rows: rows,
          routeHeaders: routeHeaders,
          lastCycle: null,
          lastPhase: "",
          lastScheduleKey: "",
          dataRevision: "",
          transitionIndex: null,
          transitionScheduleKey: ""
        };
      }

      function useParallelProtocolColumns() {
        var fullWidth = viewportWidth();
        var fullHeight = viewportHeight();
        return legacyProtocols.length === 2 && Boolean(state && state.startListParallel
          || (fullWidth >= 1100 && fullHeight > fullWidth));
      }

      function protocolColumns() {
        if (useParallelProtocolColumns()) {
          return [[legacyProtocols[0]], [legacyProtocols[1]]];
        }
        if (legacyProtocols.length > 2) return [legacyProtocols.slice(0, 2), legacyProtocols.slice(2, 4)];
        return [legacyProtocols.slice(0)];
      }

      function rebuildProtocolStructure() {
        var columns = protocolColumns();
        var column;
        var slot;
        var view;
        var i;
        var j;
        protocolLayoutEl.innerHTML = "";
        performanceCount("protocolStructureRebuilds");
        protocolViews = {};
        protocolSizeKey = "";
        for (i = 0; i < columns.length; i += 1) {
          if (!columns[i].length) continue;
          column = document.createElement("div");
          column.className = columns.length === 1 ? "protocol-column protocol-column-only" : "protocol-column";
          for (j = 0; j < columns[i].length; j += 1) {
            slot = document.createElement("div");
            slot.style.height = String(100 / columns[i].length) + "%";
            view = buildProtocolTable(columns[i][j], slot);
            protocolViews[String(view.index)] = view;
            column.appendChild(slot);
          }
          protocolLayoutEl.appendChild(column);
        }
        protocolProgressKey = "";
        scheduleViewportFit();
      }

      function ensureProtocolStructure() {
        var structureKey = protocolDataDirty ? JSON.stringify(protocolStructuralValue()) : protocolStructureKey;
        var layoutKey = legacyProtocols.map(function (entry) { return entry.index; }).join(",")
          + ":" + String(Boolean(state && state.startListParallel))
          + ":" + String(useParallelProtocolColumns())
          + ":" + String(state && (state.language || (state.config && state.config.language)) || "ru");
        var i;
        var view;
        if (structureKey !== protocolStructureKey || layoutKey !== protocolLayoutKey) {
          protocolStructureKey = structureKey;
          protocolLayoutKey = layoutKey;
          protocolDataDirty = false;
          rebuildProtocolStructure();
          return;
        }
        for (i = 0; i < legacyProtocols.length; i += 1) {
          view = protocolViews[String(legacyProtocols[i].index)];
          if (view) view.list = legacyProtocols[i].list;
        }
        protocolDataDirty = false;
      }

      function updateProtocolMarker(cell, status) {
        if (cell.status === status) return false;
        cell.status = status;
        cell.element.className = status ? "route-marker " + status : "route-marker";
        cell.element.title = protocolMarkerLabel(status);
        return true;
      }

      function updateProtocolRow(view, participantIndex) {
        var row = view.rows[participantIndex];
        var next = "";
        var i;
        if (!row) return;
        if (row.excluded) {
          row.status = "";
          row.element.className = "protocol-excluded";
          return;
        }
        for (i = 0; i < row.cells.length; i += 1) {
          if (row.cells[i].status === "active") {
            next = "active";
            break;
          }
          if (row.cells[i].status === "ready") next = "ready";
        }
        if (row.status === next) return;
        row.status = next;
        row.element.className = next ? "protocol-" + next : "";
      }

      function updateProtocolHeaders(view, cycle) {
        var incidents = window.FDVStartListDisplay.rebaseIncidents(
          view.list.incidents,
          view.list.excludedParticipants,
          view.list.rows.length
        );
        var i;
        var status;
        var header;
        for (i = 0; i < view.routeHeaders.length; i += 1) {
          status = window.FDVStartListDisplay.routeState(i, cycle, incidents);
          header = view.routeHeaders[i];
          if (header.status === status) continue;
          header.status = status;
          header.element.className = "protocol-route-cell" + (status ? " route-" + status : "");
        }
      }

      function evaluateProtocolCells(view, position, schedule, candidates) {
        var incidents = window.FDVStartListDisplay.rebaseIncidents(
          view.list.incidents,
          view.list.excludedParticipants,
          view.list.rows.length
        );
        var dirtyRows = {};
        var participantIndex;
        var routeIndex;
        var cell;
        var status;
        var i;
        if (candidates) {
          for (i = 0; i < candidates.length; i += 1) {
            cell = candidates[i];
            status = cell.calculationParticipantIndex < 0 ? "" : window.FDVStartListDisplay.marker(
              cell.calculationParticipantIndex,
              cell.routeIndex,
              position.cycle,
              position.phase,
              incidents,
              schedule
            );
            if (updateProtocolMarker(cell, status)) dirtyRows[String(cell.participantIndex)] = true;
          }
        } else {
          for (participantIndex = 0; participantIndex < view.rows.length; participantIndex += 1) {
            for (routeIndex = 0; routeIndex < view.rows[participantIndex].cells.length; routeIndex += 1) {
              cell = view.rows[participantIndex].cells[routeIndex];
              status = cell.calculationParticipantIndex < 0 ? "" : window.FDVStartListDisplay.marker(
                cell.calculationParticipantIndex,
                routeIndex,
                position.cycle,
                position.phase,
                incidents,
                schedule
              );
              if (updateProtocolMarker(cell, status)) dirtyRows[String(participantIndex)] = true;
            }
          }
        }
        for (participantIndex in dirtyRows) {
          if (Object.prototype.hasOwnProperty.call(dirtyRows, participantIndex)) {
            updateProtocolRow(view, Number(participantIndex));
          }
        }
      }

      function uniqueProtocolCells(source) {
        var result = [];
        var seen = {};
        var i;
        var cell;
        var key;
        source = source || [];
        for (i = 0; i < source.length; i += 1) {
          cell = source[i];
          key = String(cell.participantIndex) + ":" + String(cell.routeIndex);
          if (seen[key]) continue;
          seen[key] = true;
          result.push(cell);
        }
        return result;
      }

      function fastProtocolCandidates(view, position, scheduleKey) {
        var index = view.transitionIndex;
        var source;
        if (!index || view.transitionScheduleKey !== scheduleKey || view.dataRevision !== protocolRevision) return null;
        if (position.cycle === view.lastCycle + 1) {
          source = index.transitions[String(position.cycle)] || [];
          return uniqueProtocolCells(source);
        }
        if (position.cycle === view.lastCycle
            && position.phase !== view.lastPhase
            && (position.phase === "break" || position.phase === "completed")) {
          source = index.active[String(position.cycle)] || [];
          return uniqueProtocolCells(source);
        }
        return null;
      }

      function cachedProtocolAnchor(view, cycle) {
        var participantIndex;
        var routeIndex;
        var completed;
        var status;
        if (cycle <= 0) return 0;
        for (participantIndex = 0; participantIndex < view.rows.length; participantIndex += 1) {
          if (view.rows[participantIndex].excluded) continue;
          completed = true;
          for (routeIndex = 0; routeIndex < view.rows[participantIndex].cells.length; routeIndex += 1) {
            status = view.rows[participantIndex].cells[routeIndex].status;
            if (status !== "done" && status !== "stopped") {
              completed = false;
              break;
            }
          }
          if (!completed) return Math.max(0, participantIndex - 1);
        }
        return Math.max(0, view.rows.length - 1);
      }

      function scrollProtocolToAnchor(view, anchor, settle) {
        var pass = 0;
        var left = view.scroll.scrollLeft;
        function apply() {
          var header = view.table.getElementsByTagName("thead")[0];
          var headerHeight = header ? header.offsetHeight : 0;
          var sampleRow = view.rows[0] && view.rows[0].element;
          var rowHeight = sampleRow ? sampleRow.offsetHeight : 1;
          var capacity = Math.max(1, Math.floor((view.scroll.clientHeight - headerHeight) / rowHeight) - 1);
          var highlighted = protocolHighlightedIndexes(view);
          var prioritizedAnchor = window.FDVStartListDisplay.prioritizedScrollAnchor(anchor, highlighted, capacity);
          if (highlighted.length
              && highlighted[highlighted.length - 1] - highlighted[0] + 1 >= capacity) {
            prioritizedAnchor = highlighted[0];
          }
          var row = view.rows[prioritizedAnchor] && view.rows[prioritizedAnchor].element;
          var scrollRect;
          var rowRect;
          var firstHighlightedRow;
          var lastHighlightedRow;
          var firstHighlightedRect;
          var lastHighlightedRect;
          var visibleTop;
          var visibleBottom;
          if (!row) return;
          scrollRect = view.scroll.getBoundingClientRect();
          rowRect = row.getBoundingClientRect();
          view.scroll.scrollTop = Math.max(0, view.scroll.scrollTop + rowRect.top - scrollRect.top - headerHeight);
          if (highlighted.length) {
            firstHighlightedRow = view.rows[highlighted[0]] && view.rows[highlighted[0]].element;
            lastHighlightedRow = view.rows[highlighted[highlighted.length - 1]] && view.rows[highlighted[highlighted.length - 1]].element;
            if (firstHighlightedRow && lastHighlightedRow) {
              scrollRect = view.scroll.getBoundingClientRect();
              firstHighlightedRect = firstHighlightedRow.getBoundingClientRect();
              lastHighlightedRect = lastHighlightedRow.getBoundingClientRect();
              visibleTop = scrollRect.top + headerHeight;
              visibleBottom = scrollRect.top + view.scroll.clientHeight;
              if (firstHighlightedRect.top < visibleTop - 1 || lastHighlightedRect.bottom > visibleBottom + 1) {
                view.scroll.scrollTop = Math.max(0, view.scroll.scrollTop + firstHighlightedRect.top - visibleTop);
              }
            }
          }
          view.scroll.scrollLeft = left;
          positionProtocolFallbackHeader(view.scroll, view.table);
          pass += 1;
          if (settle && pass < 5) window.setTimeout(apply, pass * 40);
        }
        window.setTimeout(apply, 0);
      }

      function reanchorProtocolViews() {
        var position;
        var key;
        var view;
        if (!state) return;
        position = currentProtocolPosition(currentDisplay());
        for (key in protocolViews) {
          if (!Object.prototype.hasOwnProperty.call(protocolViews, key)) continue;
          view = protocolViews[key];
          scrollProtocolToAnchor(view, cachedProtocolAnchor(view, position.cycle), true);
        }
      }

      function updateProtocolView(view, position) {
        var schedule = protocolSchedule(view.list);
        var scheduleKey = protocolScheduleKey(schedule);
        var candidates;
        var fullUpdate;
        var anchor;
        if (view.transitionScheduleKey !== scheduleKey || view.dataRevision !== protocolRevision) {
          buildTransitionIndex(view, schedule, scheduleKey);
        }
        candidates = fastProtocolCandidates(view, position, scheduleKey);
        fullUpdate = candidates === null;
        evaluateProtocolCells(view, position, schedule, candidates);
        updateProtocolHeaders(view, position.cycle);
        anchor = cachedProtocolAnchor(view, position.cycle);
        scrollProtocolToAnchor(view, anchor, view.lastCycle === null);
        view.lastCycle = position.cycle;
        view.lastPhase = position.phase;
        view.lastScheduleKey = scheduleKey;
        view.dataRevision = protocolRevision;
        performanceCount(fullUpdate ? "protocolFullUpdates" : "protocolFastUpdates");
        return fullUpdate;
      }

      function updateProtocolSlotHeights() {
        var portrait = hasClass(document.body, "protocol-portrait");
        var columns = protocolLayoutEl.getElementsByClassName
          ? protocolLayoutEl.getElementsByClassName("protocol-column")
          : [];
        var available = Math.max(220, protocolPaneEl.clientHeight || 400);
        var maximumHeight = Math.max(280, Math.min(420, Math.floor(available * 0.52)));
        var rowHeights = [30, 27, 24, 18];
        var titleHeights = [30, 27, 25, 20];
        var rowHeight = rowHeights[protocolAppliedDensity] || rowHeights[0];
        var titleHeight;
        var highlighted;
        var span;
        var rowCount;
        var height;
        var desiredTotal;
        var extra;
        var remaining;
        var addition;
        var slots;
        var key;
        var view;
        var i;
        var j;
        if (!portrait) {
          for (i = 0; i < columns.length; i += 1) {
            slots = columns[i].getElementsByClassName("protocol-slot");
            for (j = 0; j < slots.length; j += 1) {
              slots[j].style.height = String(100 / Math.max(1, slots.length)) + "%";
            }
          }
          return;
        }
        for (key in protocolViews) {
          if (!Object.prototype.hasOwnProperty.call(protocolViews, key)) continue;
          view = protocolViews[key];
          highlighted = protocolHighlightedIndexes(view);
          span = highlighted.length ? highlighted[highlighted.length - 1] - highlighted[0] + 1 : 1;
          rowCount = Math.max(6, Math.min(12, span + 4));
          titleHeight = view.list && view.list.title ? titleHeights[protocolAppliedDensity] || titleHeights[0] : 0;
          height = Math.max(220, Math.min(maximumHeight, titleHeight + rowHeight * (rowCount + 1) + 2));
          view.slot._fdvDesiredHeight = height;
        }
        for (i = 0; i < columns.length; i += 1) {
          slots = columns[i].getElementsByClassName("protocol-slot");
          desiredTotal = 0;
          for (j = 0; j < slots.length; j += 1) {
            desiredTotal += Number(slots[j]._fdvDesiredHeight || 220);
          }
          extra = Math.max(0, available - desiredTotal);
          remaining = slots.length;
          for (j = 0; j < slots.length; j += 1) {
            addition = remaining > 0 ? Math.floor(extra / remaining) : 0;
            height = Number(slots[j]._fdvDesiredHeight || 220) + addition;
            slots[j].style.height = height + "px";
            extra -= addition;
            remaining -= 1;
          }
        }
      }

      function updateProtocolHorizontalOverflow() {
        var portrait = hasClass(document.body, "protocol-portrait");
        var key;
        var view;
        var overflow;
        for (key in protocolViews) {
          if (!Object.prototype.hasOwnProperty.call(protocolViews, key)) continue;
          view = protocolViews[key];
          overflow = !portrait && view.table.scrollWidth > view.scroll.clientWidth + 2;
          view.scroll.className = "protocol-scroll" + (overflow ? " protocol-horizontal-overflow" : "");
        }
      }

      function renderProtocols(view) {
        var visible = protocolIsVisible();
        var position;
        var progressKey;
        var key;
        setBodyFlag("protocol-visible", visible);
        protocolPaneEl.style.display = visible ? "block" : "none";
        if (!visible) {
          protocolProgressKey = "";
          return;
        }
        ensureProtocolStructure();
        position = currentProtocolPosition(view);
        progressKey = protocolRevision + ":" + String(position.cycle) + ":" + position.phase
          + ":" + protocolScheduleKey(protocolSchedule(legacyProtocols[0] && legacyProtocols[0].list));
        if (progressKey === protocolProgressKey) return;
        protocolProgressKey = progressKey;
        for (key in protocolViews) {
          if (Object.prototype.hasOwnProperty.call(protocolViews, key)) {
            updateProtocolView(protocolViews[key], position);
          }
        }
        updateProtocolSlotHeights();
        updateProtocolHorizontalOverflow();
        if (minimumProtocolVerticalDensity() !== lastProtocolVerticalDensity) {
          protocolSizeKey = "";
          syncViewportSize();
        }
      }

      function render() {
        var performanceStartedAt = performanceStart();
        var fitTextChanged;
        performanceCount("renderCalls");
        try {
        var view = currentDisplay();
        var online = new Date().getTime() - lastContact < 5000;
        var browserDisplayNumber = state ? Math.max(0, Math.round(Number(state.browserDisplayNumber) || 0)) : 0;
        if (state && state.showBrowserNumbers && browserDisplayNumber > 0) {
          if (browserNumberBadgeEl.innerHTML !== String(browserDisplayNumber)) browserNumberBadgeEl.innerHTML = String(browserDisplayNumber);
          browserNumberBadgeEl.style.display = "block";
        } else {
          browserNumberBadgeEl.style.display = "none";
        }
        var showServerClock = Boolean(state && state.showServerTime);
        setBodyFlag("server-clock-visible", showServerClock);
        if (showServerClock) {
          var serverClockLabel = formatServerClockTime(serverNow());
          if (serverClockTextEl.innerHTML !== serverClockLabel) serverClockTextEl.innerHTML = serverClockLabel;
          serverClockEl.style.display = "inline-block";
          var serverClockBottom = serverClockEl.offsetHeight + "px";
          if (serverClockEl.style.bottom !== serverClockBottom) serverClockEl.style.bottom = serverClockBottom;
          var timerClockTransform = "translateY(-" + serverClockEl.offsetHeight + "px)";
          if (timeEl.style.webkitTransform !== timerClockTransform) timeEl.style.webkitTransform = timerClockTransform;
          if (timeEl.style.transform !== timerClockTransform) timeEl.style.transform = timerClockTransform;
        } else {
          serverClockEl.style.display = "none";
          if (timeEl.style.webkitTransform) timeEl.style.webkitTransform = "";
          if (timeEl.style.transform) timeEl.style.transform = "";
        }
        if (serverClockVisible !== showServerClock) {
          serverClockVisible = showServerClock;
          invalidateTimerFit();
          fitTimerText();
        }
        setBodyFlag("break-active", view.isBreak);
        setBodyFlag("warning-active", view.warning);
        setBodyFlag("offline", !online);
        renderProtocols(view);
        var countdownPhase = view.phase === "start" || Boolean(state && state.waitingForManualStart);
        timerPaneEl.style.backgroundColor = countdownPhase ? timerColors.countdownBg : view.isBreak ? timerColors.breakBg : view.warning ? timerColors.warningBg : timerColors.rotationBg;
        document.body.style.backgroundColor = "#161b22";
        timeEl.style.color = countdownPhase ? timerColors.countdownText : view.isBreak ? timerColors.breakText : view.warning ? timerColors.warningText : timerColors.rotationText;
        var label = formatTime(view.seconds);
        if (timeEl.innerHTML !== label) {
          fitTextChanged = rememberFitText(label);
          timeEl.innerHTML = label;
          performanceCount("timerLabelChanges");
          if (fitTextChanged) fitTimerText();
        }
        return view;
        } finally {
          performanceEnd("render", performanceStartedAt);
        }
      }

      function nextRenderBoundaryDelay(view) {
        var seconds;
        var fraction;

        if (state && view && (state.running || state.countdownOnly)) {
          seconds = Number(view.seconds);
          if (seconds > 0 && isFinite(seconds)) {
            fraction = seconds - Math.floor(seconds);
            return Math.max(5, Math.min(1000, fraction > 0.001 ? fraction * 1000 : 1000));
          }
        }
        return null;
      }

      function nextRenderDelay(view) {
        var boundaryDelay = nextRenderBoundaryDelay(view);
        return boundaryDelay === null ? 250 : boundaryDelay + 25;
      }

      function scheduleRender(view) {
        var delay = nextRenderDelay(view);
        var boundaryDelay = nextRenderBoundaryDelay(view);
        if (renderTimer) window.clearTimeout(renderTimer);
        renderTargetServerTime = boundaryDelay === null ? 0 : serverNow() + boundaryDelay;
        renderTimer = window.setTimeout(renderLoop, delay);
      }

      function renderLoop() {
        var targetServerTime = renderTargetServerTime;
        var callbackServerTime;
        var beforeLabel;
        var renderStartedAt;
        var view;
        var renderCompletedAt;
        var renderCompletedServerTime;
        renderTimer = null;
        renderTargetServerTime = 0;
        callbackServerTime = serverNow();
        if (targetServerTime) {
          lastRenderDelayMs = Math.round((callbackServerTime - targetServerTime) * 10) / 10;
          lastRenderDelayAt = new Date().getTime();
        }
        if (!performanceDiagnosticsEnabled) {
          scheduleRender(render());
          return;
        }
        beforeLabel = String(timeEl.innerHTML || "");
        renderStartedAt = legacyPerformanceNow();
        view = render();
        renderCompletedAt = legacyPerformanceNow();
        renderCompletedServerTime = serverNow();
        if (targetServerTime) {
          recordDisplayBoundary({
            targetServerTimeMs: roundBoundaryMetric(targetServerTime),
            callbackServerTimeMs: roundBoundaryMetric(callbackServerTime),
            callbackLatenessMs: roundBoundaryMetric(callbackServerTime - targetServerTime),
            guardMs: 25,
            renderCompletedServerTimeMs: roundBoundaryMetric(renderCompletedServerTime),
            commitLatenessMs: roundBoundaryMetric(renderCompletedServerTime - targetServerTime),
            renderDurationMs: roundBoundaryMetric(renderCompletedAt - renderStartedAt),
            beforeLabel: beforeLabel,
            afterLabel: String(timeEl.innerHTML || ""),
            phase: view && view.phase ? String(view.phase) : "",
            cycle: currentTimerCycle(),
            visibilityState: document.visibilityState || (document.hidden ? "hidden" : "visible"),
            serverInstanceId: state && state.serverInstanceId ? String(state.serverInstanceId) : ""
          });
        }
        scheduleRender(view);
      }

      function scheduleRequest(delay) {
        if (pollTimer) window.clearTimeout(pollTimer);
        pollTimer = window.setTimeout(requestState, delay);
      }

      function updatePerformanceOverlay() {
        var snapshot;
        var renderTiming;
        var fitTiming;
        if (!performanceOverlay) return;
        snapshot = performanceSnapshot();
        renderTiming = snapshot.timings.render || {};
        fitTiming = snapshot.timings.fitTimerText || {};
        performanceOverlay.firstChild.nodeValue = [
          "PERF " + Math.round(snapshot.sampleAgeMs / 1000) + "s",
          "render " + (snapshot.counters.renderCalls || 0) + " avg " + (renderTiming.averageMs || 0) + "ms",
          "fit " + (snapshot.counters.timerFitCalls || 0) + " search " + (snapshot.counters.timerFitSearches || 0) + " avg " + (fitTiming.averageMs || 0) + "ms",
          "xhr " + (snapshot.counters.stateRequests || 0) + " bytes " + (snapshot.counters.stateResponseBytes || 0),
          "protocol full/fast " + (snapshot.counters.protocolFullUpdates || 0) + "/" + (snapshot.counters.protocolFastUpdates || 0),
          "lag max " + ((snapshot.timings.eventLoopLag || {}).maxMs || 0) + "ms"
        ].join("\n");
        if (window.console && window.console.log) {
          window.console.log("FDV_PERFORMANCE_SNAPSHOT " + JSON.stringify(snapshot));
        }
      }

      function registerOfflineServiceWorker() {
        if (!("serviceWorker" in navigator) || window.location.protocol === "file:" || !window.isSecureContext) return;
        if (!window.addEventListener) return;
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").then(function (registration) {
            if (!registration || !registration.update) return;
            registration.update().then(function () {}, function () {});
          }, function () {});
        });
      }

      function finishRequest() {
        activeRequest = null;
        activeRequestStartedAt = 0;
      }

      function abortStaleRequest() {
        if (!activeRequest) return;
        if (new Date().getTime() - activeRequestStartedAt < 7000) return;
        try {
          activeRequest.abort();
        } catch (error) {}
        finishRequest();
      }

      function requestState() {
        var xhr = new XMLHttpRequest();
        performanceCount("stateRequests");
        var reportedScreen = window.screen
          ? String(window.screen.width || 0) + "x" + String(window.screen.height || 0)
          : "";
        var url = "/api/state?legacy=1" + (manualLegacyUrl ? "&manualLegacy=1" : "") + (isOldBrowser ? "&oldBrowser=1" : "") + "&clientId=" + encodeURIComponent(clientId)
          + "&protocolRevision=" + encodeURIComponent(protocolRevision)
          + "&viewport=" + encodeURIComponent(String(viewportWidth()) + "x" + String(viewportHeight()))
          + "&screen=" + encodeURIComponent(reportedScreen)
          + "&dpr=" + encodeURIComponent(String(window.devicePixelRatio || 1))
          + "&renderDelay=" + encodeURIComponent(lastRenderDelayMs === null ? "" : String(lastRenderDelayMs))
          + "&renderDelayAge=" + encodeURIComponent(lastRenderDelayAt ? String(Math.max(0, new Date().getTime() - lastRenderDelayAt)) : "")
          + "&clientBuild=" + encodeURIComponent(String(legacyBuildNumber));
        abortStaleRequest();
        if (activeRequest) return;
        activeRequest = xhr;
        activeRequestStartedAt = new Date().getTime();
        xhr.open("GET", url, true);
        try {
          xhr.timeout = 5000;
        } catch (error) {}
        xhr.onreadystatechange = function () {
          var remote;
          var requestStartedAt;
          var responseReceivedAt;
          if (xhr.readyState !== 4) return;
          requestStartedAt = activeRequestStartedAt;
          responseReceivedAt = new Date().getTime();
          finishRequest();
          if (xhr.status < 200 || xhr.status >= 300) {
            scheduleRequest(1000);
            return;
          }
          try {
            var parsePerformanceStartedAt = performanceStart();
            if (performanceDiagnosticsEnabled) {
              performanceCount("stateResponseBytes", String(xhr.responseText || "").length);
            }
            remote = JSON.parse(xhr.responseText);
            performanceEnd("stateResponseJsonParse", parsePerformanceStartedAt);
          } catch (error) {
            scheduleRequest(1000);
            return;
          }
          if (remote.legacyRedirect) {
            sessionStorage.setItem("boulderingTimerClientId", clientId);
            sessionStorage.setItem("boulderingTimerForceModern", "1");
            window.location.replace("/");
            return;
          }
          if (manualLegacyUrl && remote.manualLegacy !== true) {
            sessionStorage.setItem("boulderingTimerClientId", clientId);
            sessionStorage.setItem("boulderingTimerForceModern", "1");
            window.location.replace("/");
            return;
          }
          if (Object.prototype.hasOwnProperty.call(remote, "legacyProtocols")) {
            legacyProtocols = cleanLegacyProtocols(remote.legacyProtocols);
            protocolRevision = String(remote.protocolRevision || "");
            protocolDataDirty = true;
            protocolProgressKey = "";
            saveLegacyProtocolSnapshot();
          } else if (remote.protocolRevision) {
            protocolRevision = String(remote.protocolRevision);
          }
          state = compactRemoteState(remote);
          applyTitle(remote.language || (remote.config && remote.config.language));
          applyTimerFont(remote.config);
          applyTimerColors(remote.config);
          updateServerOffset(remote.now, requestStartedAt || responseReceivedAt, responseReceivedAt);
          saveLegacySnapshot(state);
          lastContact = responseReceivedAt;
          scheduleRender(render());
          scheduleRequest(1000);
        };
        xhr.onerror = function () {
          finishRequest();
          scheduleRequest(1000);
        };
        xhr.ontimeout = function () {
          finishRequest();
          scheduleRequest(1000);
        };
        xhr.onabort = function () {
          finishRequest();
          scheduleRequest(1000);
        };
        try {
          xhr.send(null);
        } catch (error) {
          finishRequest();
          scheduleRequest(1000);
        }
      }

      registerOfflineServiceWorker();
      restoreLegacyProtocolSnapshot();
      restoreLegacySnapshot();
      requestState();
      scheduleRender(render());
      if (performanceDiagnosticsEnabled) {
        if (!performanceLongRunDiagnostics) {
          var expectedPerformanceProbeAt = legacyPerformanceNow() + 1000;
          window.setInterval(function () {
            var measuredAt = legacyPerformanceNow();
            var lag = Math.max(0, measuredAt - expectedPerformanceProbeAt);
            performanceCount("eventLoopLagSamples");
            performanceEnd("eventLoopLag", measuredAt - lag);
            expectedPerformanceProbeAt = measuredAt + 1000;
          }, 1000);
          updatePerformanceOverlay();
          window.setInterval(updatePerformanceOverlay, 5000);
        }
      }
      window.setInterval(function () {
        abortStaleRequest();
      }, 3000);
      if (window.addEventListener) {
        window.addEventListener("online", function () { scheduleRequest(0); });
        window.addEventListener("pageshow", function () { scheduleRequest(0); scheduleViewportFit(); });
        window.addEventListener("focus", function () { scheduleRequest(0); scheduleViewportFit(); });
      }
    })();
  </script>
</body>
