plugins { id 'com.android.application' }

def signingProperties = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
// Local release builds can use the existing key without writing passwords to
// keystore.properties. CI may continue to provide that ignored file.
def localSigningPath = System.getenv('FDV_ANDROID_KEYSTORE_PATH')
if (localSigningPath) {
    signingProperties['storeFile'] = localSigningPath
    signingProperties['storePassword'] = System.getenv('FDV_ANDROID_KEYSTORE_PASSWORD')
    signingProperties['keyAlias'] = System.getenv('FDV_ANDROID_KEY_ALIAS')
    signingProperties['keyPassword'] = System.getenv('FDV_ANDROID_KEY_PASSWORD')
}
def hasReleaseSigning = signingFile.exists() || localSigningPath

android {
    namespace 'ru.fdv.boulderingtimer.standalone'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.fdv.boulderingtimer.standalone'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('FDV_ANDROID_VERSION_CODE') ?: '1')
        versionName System.getenv('FDV_ANDROID_VERSION_NAME') ?: '0.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}
